[package]
name = "wipe-station"
version = "2.1.0"
edition = "2021"

[[bin]]
name = "wipe-station"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.20", optional = true }

[features]
default = ["gpio"]
gpio = ["dep:rppal"]
