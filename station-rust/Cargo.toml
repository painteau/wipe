[package]
name = "wipe-station"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "wipe-station"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
chrono = { version = "0.4", features = ["local-offset"] }

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.20", optional = true }

[features]
default = ["gpio"]
gpio = ["dep:rppal"]
